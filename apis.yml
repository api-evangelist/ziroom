description: 'Ziroom (自如) is a Beijing-based proptech company operating China''s largest
  centralized long-term apartment rental platform. Spun out of the Lianjia (Homelink)
  real-estate group in 2011, it leases, renovates, furnishes and manages residential
  units and re-rents them to urban tenants through its app and website, layering on
  cleaning, maintenance and smart-home services. It is backed by the SoftBank Vision
  Fund, Tencent and Sequoia Capital. This profile was added to the API Evangelist network
  as a VC-portfolio lead; enrichment found no publicly discoverable developer or API
  surface.'
